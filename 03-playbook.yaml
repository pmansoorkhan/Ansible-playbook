- name: Install & run NGINX 
  hosts: frontend
  become: yes 
  tasks:
  - name: Install NGINX 
    ansible.builtin.package:
      name: nginx 
      state: present
  - name: Enable the NGINX SERVICE
    ansible.builtin.service:
     name: nginx 
     state: started
     enabled: yes
     state: stopped
