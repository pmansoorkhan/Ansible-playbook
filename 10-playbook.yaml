- name: print variable prefernces
  hosts: local
  connection: local
  vars: 
   NAME: Ansible from PLAY 
  # vars_files:
  # - course.yaml
  vars_prompt:
  - name: NAME
    prompt: please enter your name
    private: false
  tasks:
  - name: print name
    # vars: 
    #   NAME: Ansible from TASKS 
    ansible.builtin.debug:
     msg: "Hi {{NAME}}"
  

  #priority:
  #1. Arguments passed while executing is the first priority to take varaibles.
  #2. TASKS varaibles will have the 2nd priority of taking the varaibles.
  #3. variables  from files will be the 3rd priority of executing.

