- name: Demo on conditions
  hosts: local
  connection: local
  vars:
    IS_LIVE: false
  tasks: 
  - name: Check whether is live or not
    ansible.builtin.debug:
      msg : "Yes, it is live only"
    when: IS_LIVE

    # IS_LIVE: true ---> means it will check the when condition and execute the task and prints the msg.
    # IS_LIVE: false---> means it will skipping the when condition and nothing is printed.
