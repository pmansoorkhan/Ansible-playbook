- name: Demo on conditions
  hosts: local
  connection: local
  vars:
    IS_LIVE: false
  tasks: 
  - name: Check whether is live or not
    ansible.builtin.debug:
      msg : "Yes, it is live only"
    when: IS_LIVE

    # IS_LIVE: true ---> means  the when condition is true so it will execute the task and prints the msg.
    # IS_LIVE: false---> means the when condition is false it will skips the tasks and nothing is printed.
